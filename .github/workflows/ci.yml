# Continuous integration for GhostName.
#
# Runs the same commands a contributor runs locally (see README and
# 03_BUILD_STATUS.md): install from the lockfile, typecheck, the offline test
# suite, the production build with its bundle guard, and the release guards
# over dist/. Network-gated live suites stay skipped: RUN_LIVE is never set
# here and no secrets are used, so CI can never spend testnet funds or touch
# mainnet.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # engines.node is ">=20"; test the documented floor and the current LTS.
        node: [20, 22]
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (typecheck, vite build, bundle guard)
        run: npm run build

      - name: Release guards over dist
        run: npx vitest run tests/no-personal-name.test.ts tests/csp.test.ts
